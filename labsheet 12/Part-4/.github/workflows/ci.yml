# ──────────────────────────────────────────────────────────
#  CI / CD Pipeline
#  • Triggers on PRs to main AND pushes to main
#  • Tests across Node 18 & 20 with npm caching
#  • Lint → Test (sequential)
#  • Deploy only on push to main, after tests pass
# ──────────────────────────────────────────────────────────

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ───────────── TEST JOB ─────────────
  test:
    name: Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      # 1. Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up the correct Node version with npm caching
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm                       # caches ~/.npm between runs

      # 3. Install dependencies (clean install for CI)
      - name: Install dependencies
        run: npm ci

      # 4. Run the linter FIRST
      - name: Run lint
        run: npm run lint

      # 5. Run the test suite AFTER lint passes
      - name: Run tests
        run: npm test

  # ───────────── DEPLOY JOB ─────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test                            # only runs if ALL matrix test jobs pass
    if: github.event_name == 'push'        # only on pushes to main, NOT on PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        run: |
          echo "🚀 Deploying to production..."
          # Replace with your actual deploy command, for example:
          # npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
          # or: aws s3 sync ./dist s3://my-bucket --delete
          echo "✅ Deployment complete!"
