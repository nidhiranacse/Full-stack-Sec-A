name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    working-directory: problem1-task-api   # change/remove if package.json is at repo root

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: problem1-task-api/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    needs: lint                      # lint runs first, then tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: problem1-task-api/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          JWT_SECRET: ci-test-secret

  deploy:
    needs: test                      # only runs if every matrix test job passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: echo "Deploying..."     # replace with your real deploy command
