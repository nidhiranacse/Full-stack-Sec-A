<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruits</title>
</head>
<body>

    <h1>Fruits List</h1>

    {% if fruits %}
        <ul>
            {% for fruit in fruits %}
                <li>{{ fruit }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No fruits are available.</p>
    {% endif %}

</body>
</html>
