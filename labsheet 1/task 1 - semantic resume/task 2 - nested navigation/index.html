<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nested Navigation Menu</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><h1>Learning Hub</h1><p>Explore topics and resources</p></header>
  <nav aria-label="Learning hub navigation">
    <ul class="menu">
      <li><a href="https://developer.mozilla.org/en-US/docs/Web/HTML">HTML</a>
        <ul>
          <li><a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Introduction_to_HTML">HTML Basics</a></li>
          <li><a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Element">HTML Elements</a></li>
        </ul>
      </li>
      <li><a href="https://developer.mozilla.org/en-US/docs/Web/CSS">CSS</a>
        <ul>
          <li><a href="https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics">CSS Basics</a></li>
          <li><a href="https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_flexible_box_layout">Flexbox</a></li>
        </ul>
      </li>
      <li><a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript">JavaScript</a>
        <ul>
          <li><a href="https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting">Scripting</a></li>
          <li><a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide">JS Guide</a></li>
        </ul>
      </li>
    </ul>
  </nav>
  <main><h2>Welcome</h2><p>Choose a topic from the navigation menu. Each top-level topic contains related links.</p></main>
</body>
</html>
