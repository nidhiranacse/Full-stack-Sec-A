{% extends "base.html" %}

{% block title %}
Contact Us - Student Portal
{% endblock %}

{% block content %}

<h2>Contact Us</h2>

<p>
    Please fill out the form below to send your feedback.
</p>

<form method="POST" action="{{ url_for('contact') }}">

    <label for="name">Name</label>

    <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your name"
        required
    >

    <label for="email">Email</label>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
    >

    <label for="message">Message</label>

    <textarea
        id="message"
        name="message"
        placeholder="Enter your feedback"
        required
    ></textarea>

    <button type="submit">
        Submit Feedback
    </button>

</form>

{% endblock %}
