<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        {{ page_title }}
    </title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f7f7fa;
            color: #222;
        }

        h1 {
            color: #2b3a67;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #2b3a67;
            font-weight: bold;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 15px;
            background: #ffffff;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background: #2b3a67;
            color: white;
        }

        th a {
            color: white;
            text-decoration: none;
        }

        ul.fruit-list {
            list-style: disc;
            padding-left: 25px;
        }

        .alert {
            padding: 12px 16px;
            background: #ffe9e9;
            border: 1px solid #e57373;
            color: #b71c1c;
            border-radius: 4px;
            margin-top: 10px;
        }

        .search-form {
            margin-bottom: 20px;
        }

        .search-form input[type="text"] {
            padding: 8px;
            margin-right: 6px;
        }

        .search-form button {
            padding: 8px 14px;
            background: #2b3a67;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .sort-links {
            margin-bottom: 15px;
        }

        .sort-links a {
            color: #2b3a67;
            margin-right: 8px;
            font-weight: bold;
            text-decoration: none;
        }

    </style>

</head>


<body>

    <nav>

        <a href="{% url 'fruit_list' %}">
            Fruits (Unordered)
        </a>

        <a href="{% url 'student_list' %}">
            Students (Ordered)
        </a>

        <a href="{% url 'student_search' %}">
            Search Students
        </a>

    </nav>


    <h1>
        {{ page_title }}
    </h1>


    {% block content %}

    {% endblock %}


</body>

</html>
