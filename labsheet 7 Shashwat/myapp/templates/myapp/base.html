<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Lab 7 – Django Collections{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 14px 32px;
      display: flex;
      align-items: center;
      gap: 28px;
    }
    nav .brand {
      font-weight: 700;
      font-size: 1.1rem;
      color: #38bdf8;
      margin-right: auto;
    }
    nav a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.92rem;
      padding: 6px 14px;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
    }
    nav a:hover, nav a.active { background: #334155; color: #f1f5f9; }

    /* ── MAIN WRAPPER ── */
    main { max-width: 960px; margin: 40px auto; padding: 0 24px; }

    h1 { font-size: 1.6rem; font-weight: 700; color: #f1f5f9; margin-bottom: 6px; }
    .subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 28px; }

    /* ── ALERT ── */
    .alert {
      background: #7c3aed22;
      border: 1px solid #7c3aed;
      color: #c4b5fd;
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 20px;
      font-size: 0.92rem;
    }

    /* ── CARD ── */
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 28px;
    }
    .card h2 {
      font-size: 1.05rem;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── UNORDERED LIST ── */
    ul.fruit-list { list-style: none; display: flex; flex-wrap: wrap; gap: 10px; }
    ul.fruit-list li {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    ul.fruit-list li .dot {
      width: 10px; height: 10px; border-radius: 50%;
      display: inline-block;
    }

    /* ── ORDERED LIST ── */
    ol.student-list {
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    ol.student-list li {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.9rem;
      list-style-position: inside;
    }
    ol.student-list li span { color: #64748b; font-size: 0.82rem; margin-left: 8px; }

    /* ── TABLE ── */
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 11px 14px; text-align: left; font-size: 0.9rem; }
    thead tr { background: #0f172a; }
    th { color: #38bdf8; font-weight: 600; }
    th a { color: #38bdf8; text-decoration: none; }
    th a:hover { text-decoration: underline; }
    th.active-sort { color: #facc15; }
    tbody tr { border-top: 1px solid #1e293b; }
    tbody tr:hover { background: #1e293b44; }
    td { color: #cbd5e1; }
    .badge {
      display: inline-block;
      background: #0ea5e922;
      color: #38bdf8;
      border: 1px solid #0ea5e955;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.78rem;
    }

    /* ── SEARCH FORM ── */
    .search-row { display: flex; gap: 10px; margin-bottom: 24px; }
    .search-row input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-row input:focus { border-color: #38bdf8; }
    .search-row button {
      background: #0ea5e9;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 0.92rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .search-row button:hover { background: #0284c7; }
    .result-count { color: #64748b; font-size: 0.85rem; margin-bottom: 14px; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">🧑‍💻 Lab Sheet 7 – Shashwat</span>
    <a href="/" {% if request.path == '/' %}class="active"{% endif %}>7.1 Collections</a>
    <a href="/sort/" {% if request.path == '/sort/' %}class="active"{% endif %}>7.2 Sort</a>
    <a href="/search/" {% if request.path == '/search/' %}class="active"{% endif %}>7.3 Search</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
