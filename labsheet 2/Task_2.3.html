<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Task UI</title>
    <style>
        :root {
            --bg-dark: #050510;
            --glass-bg: rgba(20, 20, 35, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --neon-blue: #00f0ff;
            --neon-purple: #8a2be2;
            --neon-green: #00ff88;
            --neon-red: #ff003c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(138, 43, 226, 0.08), transparent 25%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Glassmorphism Container */
        .app-container {
            background: var(--glass-bg);
            width: 100%;
            max-width: 500px;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        /* Input Area */
        .input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 0.5rem;
            position: relative;
        }

        input[type="text"] {
            flex: 1;
            padding: 1rem 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        input[type="text"]:focus {
            border-color: var(--neon-blue);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 15px rgba(0, 240, 255, 0.2);
        }

        input[type="text"].error {
            border-color: var(--neon-red);
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.3);
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
        }

        button.btn-add {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: white;
            border: none;
            padding: 0 1.5rem;
            border-radius: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        button.btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.5);
        }

        /* Operational Validation Error Flag */
        .validation-msg {
            color: var(--neon-red);
            font-size: 0.85rem;
            font-weight: 600;
            min-height: 20px;
            margin-bottom: 1.5rem;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            text-shadow: 0 0 8px rgba(255, 0, 60, 0.5);
            letter-spacing: 1px;
        }

        .validation-msg.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Todo List */
        .todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border-left: 4px solid var(--neon-blue);
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease-out forwards;
        }

        .todo-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(5px);
        }

        .todo-item.completed {
            border-left-color: var(--text-muted);
            opacity: 0.6;
        }

        .todo-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-text {
            flex: 1;
            font-size: 1.05rem;
            word-break: break-word;
            transition: color 0.3s;
        }

        /* Action Buttons */
        .action-btns {
            display: flex;
            gap: 0.8rem;
        }

        .action-btns button {
            border: none;
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .btn-complete { color: var(--neon-green); }
        .btn-complete:hover { 
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }
        
        .btn-delete { color: var(--neon-red); }
        .btn-delete:hover { 
            background: rgba(255, 0, 60, 0.1);
            border-color: var(--neon-red);
            box-shadow: 0 0 10px rgba(255, 0, 60, 0.2);
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Telemetry Tasks</h1>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Initialize new sequence..." autocomplete="off">
            <button class="btn-add" id="addTaskBtn">Add</button>
        </div>
        
        <div class="validation-msg" id="validationMsg">ERROR: NULL INPUT DETECTED</div>

        <ul class="todo-list" id="todoList">
            <!-- Dynamic elements injected here -->
        </ul>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const taskInput = document.getElementById('taskInput');
            const addTaskBtn = document.getElementById('addTaskBtn');
            const validationMsg = document.getElementById('validationMsg');
            const todoList = document.getElementById('todoList');

            // 1. Operational Validation Logic
            function validateInput(value) {
                if (value.trim() === '') {
                    taskInput.classList.add('error');
                    validationMsg.classList.add('visible');
                    setTimeout(() => taskInput.classList.remove('error'), 300);
                    return false;
                }
                validationMsg.classList.remove('visible');
                taskInput.classList.remove('error');
                return true;
            }

            // 2. Runtime Element Append Mechanism
            function createTaskElement(taskText) {
                const li = document.createElement('li');
                li.className = 'todo-item';

                const span = document.createElement('span');
                span.className = 'task-text';
                span.textContent = taskText;

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'action-btns';

                const completeBtn = document.createElement('button');
                completeBtn.className = 'btn-complete';
                completeBtn.innerHTML = '&#10003;'; // Checkmark
                completeBtn.addEventListener('click', () => {
                    li.classList.toggle('completed');
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn-delete';
                deleteBtn.innerHTML = '&#10005;'; // X mark
                deleteBtn.addEventListener('click', () => {
                    li.style.transform = 'scale(0.95)';
                    li.style.opacity = '0';
                    setTimeout(() => li.remove(), 250);
                });

                actionsDiv.appendChild(completeBtn);
                actionsDiv.appendChild(deleteBtn);
                li.appendChild(span);
                li.appendChild(actionsDiv);

                todoList.appendChild(li);
            }

            // 3. Event Listeners
            function handleAddTask() {
                const text = taskInput.value;
                if (validateInput(text)) {
                    createTaskElement(text.trim());
                    taskInput.value = '';
                    taskInput.focus();
                }
            }

            addTaskBtn.addEventListener('click', handleAddTask);

            taskInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleAddTask();
                }
            });

            taskInput.addEventListener('input', () => {
                if (taskInput.value.trim() !== '') {
                    validationMsg.classList.remove('visible');
                    taskInput.classList.remove('error');
                }
            });
        });
    </script>
</body>
</html>
