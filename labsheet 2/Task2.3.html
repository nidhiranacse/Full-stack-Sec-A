<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo Application</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e8f0f7, #f8fafc);
    min-height: 100vh;
    color: #222;
}
.container {
    width: 92%;
    max-width: 700px;
    margin: 50px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}
.header {
    text-align: center;
    margin-bottom: 25px;
}
.header h1 {
    color: #1f4e79;
    margin-bottom: 8px;
}
.header p {
    color: #666;
    font-size: 15px;
}
.input-area {
    display: flex;
    gap: 10px;
}
#taskInput {
    flex: 1;
    padding: 13px;
    border: 1px solid #bbb;
    border-radius: 6px;
    font-size: 15px;
    outline: none;
}
#taskInput:focus {
    border-color: #1f4e79;
}
#addButton {
    padding: 13px 20px;
    border: none;
    border-radius: 6px;
    background-color: #1f4e79;
    color: white;
    cursor: pointer;
    font-size: 15px;
}
#addButton:hover {
    background-color: #163a5c;
}
#error {
    color: #d00000;
    font-size: 14px;
    margin-top: 8px;
    min-height: 18px;
}
.stats {
    display: flex;
    justify-content: space-between;
    background-color: #f4f7fa;
    padding: 15px;
    border-radius: 7px;
    margin-top: 20px;
    text-align: center;
}
.stat {
    flex: 1;
}
.stat strong {
    display: block;
    color: #1f4e79;
    font-size: 20px;
}
.stat span {
    font-size: 13px;
    color: #666;
}
.filters {
    display: flex;
    gap: 8px;
    margin: 20px 0;
    flex-wrap: wrap;
}
.filter-button {
    padding: 8px 14px;
    border: 1px solid #bbb;
    background-color: white;
    border-radius: 5px;
    cursor: pointer;
}
.filter-button:hover,
.filter-button.active {
    background-color: #1f4e79;
    color: white;
    border-color: #1f4e79;
}
#taskList {
    list-style: none;
}
.task {
    display: flex;
    align-items: center;
    gap: 10px;
    background-color: #f8fafc;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 7px;
    border-left: 4px solid #1f4e79;
}
.task.completed {
    opacity: 0.7;
    border-left-color: #4b8b3b;
}
.task.completed .task-text {
    text-decoration: line-through;
    color: #777;
}
.task-text {
    flex: 1;
    word-break: break-word;
}
.task input[type="checkbox"] {
    width: 17px;
    height: 17px;
    cursor: pointer;
}
.task-button {
    border: none;
    padding: 7px 10px;
    border-radius: 4px;
    color: white;
    cursor: pointer;
}
.edit-button {
    background-color: #e0a800;
}
.delete-button {
    background-color: #d9534f;
}
.edit-button:hover {
    background-color: #c28d00;
}
.delete-button:hover {
    background-color: #b52b27;
}
.bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
}
#clearButton {
    border: none;
    background-color: #555;
    color: white;
    padding: 9px 14px;
    border-radius: 5px;
    cursor: pointer;
}
#clearButton:hover {
    background-color: #333;
}
#emptyMessage {
    text-align: center;
    color: #777;
    padding: 25px;
    display: none;
}
@media (max-width: 600px) {
    .container {
        width: 94%;
        margin: 25px auto;
        padding: 20px;
    }
    .input-area {
        flex-direction: column;
    }
    #addButton {
        width: 100%;
    }
    .stats {
        gap: 5px;
    }
    .task {
        flex-wrap: wrap;
    }
    .task-text {
        min-width: 150px;
    }
    .bottom {
        flex-direction: column;
        gap: 12px;
    }
}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>My Todo List</h1>
<p>Organize your daily tasks and keep track of your progress</p>
</div>
<div class="input-area">
<input type="text" id="taskInput" placeholder="Enter a new task">
<button id="addButton" onclick="addTask()">Add Task</button>
</div>
<p id="error"></p>
<div class="stats">
<div class="stat">
<strong id="totalCount">0</strong>
<span>Total</span>
</div>
<div class="stat">
<strong id="pendingCount">0</strong>
<span>Pending</span>
</div>
<div class="stat">
<strong id="completedCount">0</strong>
<span>Completed</span>
</div>
</div>
<div class="filters">
<button class="filter-button active" onclick="setFilter('all', this)">All</button>
<button class="filter-button" onclick="setFilter('pending', this)">Pending</button>
<button class="filter-button" onclick="setFilter('completed', this)">Completed</button>
</div>
<ul id="taskList"></ul>
<p id="emptyMessage">No tasks available.</p>
<div class="bottom">
<span id="progressText">0% completed</span>
<button id="clearButton" onclick="clearCompleted()">Clear Completed</button>
</div>
</div>
<script>
let tasks = JSON.parse(localStorage.getItem("todoTasks")) || [];
let currentFilter = "all";
function saveTasks() {
    localStorage.setItem("todoTasks", JSON.stringify(tasks));
}
function addTask() {
    const input = document.getElementById("taskInput");
    const error = document.getElementById("error");
    const text = input.value.trim();
    error.innerText = "";
    if (text === "") {
        error.innerText = "Please enter a task.";
        input.focus();
        return;
    }
    const duplicate = tasks.some(task => task.text.toLowerCase() === text.toLowerCase());
    if (duplicate) {
        error.innerText = "This task already exists.";
        input.focus();
        return;
    }
    tasks.push({
        id: Date.now(),
        text: text,
        completed: false
    });
    input.value = "";
    saveTasks();
    displayTasks();
    input.focus();
}
function displayTasks() {
    const list = document.getElementById("taskList");
    const emptyMessage = document.getElementById("emptyMessage");
    list.innerHTML = "";
    let filteredTasks = tasks;
    if (currentFilter === "pending") {
        filteredTasks = tasks.filter(task => !task.completed);
    } else if (currentFilter === "completed") {
        filteredTasks = tasks.filter(task => task.completed);
    }
    if (filteredTasks.length === 0) {
        emptyMessage.style.display = "block";
    } else {
        emptyMessage.style.display = "none";
    }
    filteredTasks.forEach(task => {
        const li = document.createElement("li");
        li.className = "task";
        if (task.completed) {
            li.classList.add("completed");
        }
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.onchange = function() {
            toggleTask(task.id);
        };
        const span = document.createElement("span");
        span.className = "task-text";
        span.innerText = task.text;
        const editButton = document.createElement("button");
        editButton.innerText = "Edit";
        editButton.className = "task-button edit-button";
        editButton.onclick = function() {
            editTask(task.id);
        };
        const deleteButton = document.createElement("button");
        deleteButton.innerText = "Delete";
        deleteButton.className = "task-button delete-button";
        deleteButton.onclick = function() {
            deleteTask(task.id);
        };
        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(editButton);
        li.appendChild(deleteButton);
        list.appendChild(li);
    });
    updateStats();
}
function toggleTask(id) {
    tasks = tasks.map(task => {
        if (task.id === id) {
            task.completed = !task.completed;
        }
        return task;
    });
    saveTasks();
    displayTasks();
}
function editTask(id) {
    const task = tasks.find(task => task.id === id);
    const newText = prompt("Edit your task:", task.text);
    if (newText === null) {
        return;
    }
    const text = newText.trim();
    if (text === "") {
        alert("Task cannot be empty.");
        return;
    }
    const duplicate = tasks.some(item => item.id !== id && item.text.toLowerCase() === text.toLowerCase());
    if (duplicate) {
        alert("This task already exists.");
        return;
    }
    task.text = text;
    saveTasks();
    displayTasks();
}
function deleteTask(id) {
    tasks = tasks.filter(task => task.id !== id);
    saveTasks();
    displayTasks();
}
function clearCompleted() {
    tasks = tasks.filter(task => !task.completed);
    saveTasks();
    displayTasks();
}
function setFilter(filter, button) {
    currentFilter = filter;
    document.querySelectorAll(".filter-button").forEach(btn => {
        btn.classList.remove("active");
    });
    button.classList.add("active");
    displayTasks();
}
function updateStats() {
    const total = tasks.length;
    const completed = tasks.filter(task => task.completed).length;
    const pending = total - completed;
    const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
    document.getElementById("totalCount").innerText = total;
    document.getElementById("pendingCount").innerText = pending;
    document.getElementById("completedCount").innerText = completed;
    document.getElementById("progressText").innerText = percentage + "% completed";
}
document.getElementById("taskInput").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        addTask();
    }
});
displayTasks();
</script>
</body>
</html>
