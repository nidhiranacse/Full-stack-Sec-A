<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 2 | Dynamic UI</title>
    <style>
        /* Task 2.1: CSS Variables */
        :root {
            --bg-main: #0a0a0a; --bg-card: #171717; --accent: #fbbf24; --text: #f8fafc; --text-muted: #94a3b8; --border: #333;
        }
        [data-theme="high-contrast"] {
            --bg-main: #000000; --bg-card: #000000; --accent: #eab308; --text: #ffffff; --text-muted: #cccccc; --border: #eab308;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; transition: all 0.3s ease; }
        body { background: var(--bg-main); color: var(--text); padding: 2rem; }
        .dashboard { max-width: 1000px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 2rem; }
        h1 { color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        .btn-toggle { background: transparent; color: var(--accent); border: 2px solid var(--accent); padding: 0.6rem 1.2rem; border-radius: 4px; cursor: pointer; font-weight: 600; text-transform: uppercase; }
        .btn-toggle:hover { background: var(--accent); color: #000; }
        
        /* Task 2.2: Responsive Flexbox Grid */
        h2 { margin-bottom: 1rem; color: var(--text); font-weight: 600; }
        .grid-container { display: flex; flex-wrap: wrap; gap: 1.5rem; margin-bottom: 3rem; }
        .grid-card { flex: 1 1 250px; background: var(--bg-card); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 6px; padding: 2rem; text-align: center; cursor: pointer; }
        .grid-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 20px rgba(251, 191, 36, 0.1); }
        .grid-card h3 { color: var(--accent); margin-bottom: 0.5rem; }
        
        /* Task 2.3: Task Manager */
        .task-container { background: var(--bg-card); border: 1px solid var(--border); padding: 2rem; border-radius: 8px; }
        .input-wrapper { display: flex; gap: 1rem; margin-bottom: 0.5rem; }
        input[type="text"] { flex: 1; padding: 1rem; background: var(--bg-main); border: 1px solid var(--border); color: var(--text); border-radius: 4px; outline: none; }
        input[type="text"]:focus { border-color: var(--accent); }
        .btn-add { background: var(--accent); color: #000; border: none; padding: 0 2rem; font-weight: 700; border-radius: 4px; cursor: pointer; }
        
        .error-flag { color: #ef4444; font-size: 0.9rem; font-weight: 600; opacity: 0; margin-bottom: 1.5rem; display: block; }
        .error-flag.active { opacity: 1; }
        
        .todo-list { list-style: none; }
        .todo-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: 4px; margin-bottom: 0.5rem; }
        .btn-delete { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; }
        .btn-delete:hover { background: #ef4444; color: #fff; }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Task 2.1 -->
        <header>
            <h1>Aditi Workspace</h1>
            <button class="btn-toggle" id="themeBtn">Contrast Mode</button>
        </header>

        <!-- Task 2.2 -->
        <h2>Development & Creative Pillars</h2>
        <div class="grid-container">
            <div class="grid-card">
                <h3>Data Analysis</h3>
                <p>Pandas, NumPy, Scikit-learn</p>
            </div>
            <div class="grid-card">
                <h3>Web Architecture</h3>
                <p>React, Flask, DOM Manipulation</p>
            </div>
            <div class="grid-card">
                <h3>Creative Pursuits</h3>
                <p>Singing & Dancing</p>
            </div>
        </div>

        <!-- Task 2.3 -->
        <div class="task-container">
            <h2>Workflow Operations</h2>
            <div class="input-wrapper">
                <input type="text" id="taskInput" placeholder="Initialize new project task..." autocomplete="off">
                <button class="btn-add" id="addTaskBtn">EXECUTE</button>
            </div>
            <span class="error-flag" id="errorFlag">SYSTEM ERR: Task payload cannot be empty.</span>
            <ul class="todo-list" id="todoList"></ul>
        </div>
    </div>

    <script>
        // Theme Engine
        const themeBtn = document.getElementById('themeBtn');
        themeBtn.addEventListener('click', () => {
            const isHigh = document.body.getAttribute('data-theme') === 'high-contrast';
            document.body.setAttribute('data-theme', isHigh ? 'standard' : 'high-contrast');
        });

        // Task Validation & Runtime Append Engine
        const taskInput = document.getElementById('taskInput');
        const errorFlag = document.getElementById('errorFlag');
        const todoList = document.getElementById('todoList');
        
        document.getElementById('addTaskBtn').addEventListener('click', () => {
            const text = taskInput.value.trim();
            if (!text) {
                errorFlag.classList.add('active');
                setTimeout(() => errorFlag.classList.remove('active'), 2500);
                return;
            }
            errorFlag.classList.remove('active');
            
            const li = document.createElement('li');
            li.className = 'todo-item';
            
            const span = document.createElement('span');
            span.textContent = text;
            
            const delBtn = document.createElement('button');
            delBtn.className = 'btn-delete';
            delBtn.textContent = 'TERMINATE';
            delBtn.onclick = () => li.remove();
            
            li.appendChild(span);
            li.appendChild(delBtn);
            todoList.appendChild(li);
            taskInput.value = '';
        });
    </script>
</body>
</html>
