<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Photo Grid</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><p class="eyebrow">A LITTLE INSPIRATION</p><h1>Moments in focus</h1><p>A responsive gallery built with Flexbox.</p></header>
  <main class="gallery" aria-label="Photo gallery">
    <figure><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Mountain lake surrounded by green hills"><figcaption>Quiet places</figcaption></figure>
    <figure><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Sunlight shining through a forest"><figcaption>Into the woods</figcaption></figure>
    <figure><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Open landscape beneath a wide sky"><figcaption>Open horizons</figcaption></figure>
    <figure><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=80" alt="Golden sunrise over a landscape"><figcaption>First light</figcaption></figure>
    <figure><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="Mountain valley reflected in water"><figcaption>Still waters</figcaption></figure>
    <figure><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80" alt="Snow-capped mountain peaks"><figcaption>Higher ground</figcaption></figure>
  </main>
</body>
</html>
