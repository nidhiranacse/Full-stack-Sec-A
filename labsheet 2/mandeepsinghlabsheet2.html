<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Website Project</title>

<style>

:root{
    --bg-color:#f4f7fc;
    --text-color:#222;
    --card-color:#ffffff;
    --primary:#2563eb;
    --shadow:0 5px 15px rgba(0,0,0,0.15);
}

.dark-mode{
    --bg-color:#121212;
    --text-color:#ffffff;
    --card-color:#1f1f1f;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:var(--bg-color);
    color:var(--text-color);
    transition:0.4s ease;
}

.hero{
    min-height:60vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:linear-gradient(135deg,#2563eb,#06b6d4);
    color:white;
    padding:40px;
}

.hero h1{
    font-size:3rem;
    margin-bottom:15px;
}

.hero p{
    font-size:1.2rem;
    margin-bottom:20px;
}

.toggle-btn{
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:white;
    color:#2563eb;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.toggle-btn:hover{
    transform:scale(1.05);
}

.gallery-section{
    padding:50px 20px;
}

.gallery-section h2{
    text-align:center;
    margin-bottom:30px;
    color:var(--primary);
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.photo{
    flex:1 1 300px;
    max-width:350px;
    overflow:hidden;
    border-radius:12px;
    box-shadow:var(--shadow);
}

.photo img{
    width:100%;
    height:100%;
    display:block;
    transition:0.4s;
}

.photo:hover img{
    transform:scale(1.1);
}

.todo-section{
    padding:50px 20px;
}

.todo-section h2{
    text-align:center;
    margin-bottom:25px;
    color:var(--primary);
}

.todo-container{
    max-width:600px;
    margin:auto;
    background:var(--card-color);
    padding:25px;
    border-radius:12px;
    box-shadow:var(--shadow);
}

.input-group{
    display:flex;
    gap:10px;
}

.input-group input{
    flex:1;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
}

.input-group button{
    padding:12px 20px;
    border:none;
    background:var(--primary);
    color:white;
    border-radius:6px;
    cursor:pointer;
}

.input-group button:hover{
    opacity:0.9;
}

#error{
    color:red;
    margin-top:10px;
    font-size:14px;
}

#todoList{
    list-style:none;
    margin-top:20px;
}

#todoList li{
    background:var(--bg-color);
    padding:12px;
    margin-bottom:10px;
    border-radius:6px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.delete-btn{
    background:red;
    color:white;
    border:none;
    padding:6px 10px;
    border-radius:5px;
    cursor:pointer;
}

footer{
    text-align:center;
    padding:20px;
    background:#111827;
    color:white;
    margin-top:30px;
}

/* RESPONSIVE */
@media(max-width:768px){

    .hero h1{
        font-size:2rem;
    }

    .input-group{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<section class="hero">
    <h1>Interactive Website Project</h1>
    <p>HTML + CSS + JavaScript Demonstration</p>

    <button class="toggle-btn" onclick="toggleTheme()">
        🌙 Toggle Dark Mode
    </button>
</section>

<section class="gallery-section">
    <h2>Responsive Photo Gallery</h2>

    <div class="gallery">

        <div class="photo">
            <img src="https://picsum.photos/400/300?1" alt="Photo 1">
        </div>

        <div class="photo">
            <img src="https://picsum.photos/400/300?2" alt="Photo 2">
        </div>

        <div class="photo">
            <img src="https://picsum.photos/400/300?3" alt="Photo 3">
        </div>

        <div class="photo">
            <img src="https://picsum.photos/400/300?4" alt="Photo 4">
        </div>

        <div class="photo">
            <img src="https://picsum.photos/400/300?5" alt="Photo 5">
        </div>

        <div class="photo">
            <img src="https://picsum.photos/400/300?6" alt="Photo 6">
        </div>

    </div>
</section>

<section class="todo-section">
    <h2>Interactive Todo Application</h2>

    <div class="todo-container">

        <div class="input-group">
            <input
                type="text"
                id="todoInput"
                placeholder="Enter a new task">
            <button onclick="addTask()">Add Task</button>
        </div>

        <p id="error"></p>

        <ul id="todoList"></ul>

    </div>
</section>

<footer>
    <p>© 2026 Interactive Website Project</p>
</footer>


<script>

/* Task 2.1 Dark Mode Toggle */
function toggleTheme(){
    document.body.classList.toggle("dark-mode");
}

/* Task 2.3 Todo Application */
function addTask(){

    const input = document.getElementById("todoInput");
    const error = document.getElementById("error");
    const todoList = document.getElementById("todoList");

    let task = input.value.trim();

    if(task === ""){
        error.innerHTML = "⚠ Please enter a task!";
        return;
    }

    error.innerHTML = "";

    const li = document.createElement("li");

    li.innerHTML = `
        ${task}
        <button class="delete-btn" onclick="removeTask(this)">
            Delete
        </button>
    `;

    todoList.appendChild(li);

    input.value = "";
}

function removeTask(button){
    button.parentElement.remove();
}

</script>

</body>
</html>
