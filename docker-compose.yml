services:
  mongodb:
    image: mongo:8
    container_name: campusconnect-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7
    container_name: campusconnect-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: campusconnect-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/campusconnect
      JWT_SECRET: campusconnect_secret_key
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis

  frontend:
    build: ./frontend
    container_name: campusconnect-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongodb_data: