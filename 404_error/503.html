<!DOCTYPE html>
<html>
<head>
    <title>503 - Service Unavailable</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px 20px; background-color: #fdf2f2; }
        h1 { font-size: 60px; color: #e74c3c; margin: 0; }
        h2 { color: #333; }
        p { color: #666; font-size: 16px; }
        a { display: inline-block; margin-top: 20px; text-decoration: none; background: #e74c3c; color: #fff; padding: 10px 20px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>503</h1>
    <h2>Service Unavailable</h2>
    <p>The server is currently unable to handle the request due to maintenance or high traffic load.</p>
    <a href="/">Go Home</a>
</body>
</html>
