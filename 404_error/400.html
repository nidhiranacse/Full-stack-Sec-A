<!DOCTYPE html>
<html>
<head>
    <title>400 - Bad Request</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, Helvetica, sans-serif; text-align: center; padding: 80px 20px; background-color: #ffffff; color: #000000; }
        h1 { font-size: 80px; font-weight: 900; line-height: 1; margin-bottom: 12px; }
        h2 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
        p { color: #555555; font-size: 16px; max-width: 460px; margin: 0 auto 30px; line-height: 1.5; }
        a { display: inline-block; text-decoration: none; background: #000000; color: #ffffff; padding: 12px 24px; border: 2px solid #000000; border-radius: 4px; font-weight: 600; font-size: 15px; transition: 0.15s ease; }
        a:hover { background: #ffffff; color: #000000; }
    </style>
</head>
<body>
    <h1>400</h1>
    <h2>Bad Request</h2>
    <p>The server cannot process the request due to invalid syntax or malformed request routing.</p>
    <a href="/">Go Home</a>
</body>
</html>
