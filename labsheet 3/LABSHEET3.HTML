<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lab 3 React Todo Application - Rahul Raj">
  <title>Lab 3 - React Todo App | Rahul Raj</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-width: 320px;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 35%),
        #eef3f8;
      color: #172033;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
    }

    .hero {
      color: white;
      background: linear-gradient(135deg, #0f172a, #1e3a8a 60%, #2563eb);
      padding: 70px 20px 100px;
    }

    .hero-content {
      width: min(92%, 1050px);
      margin: auto;
    }

    .lab-badge {
      display: inline-block;
      padding: 7px 12px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1.5px;
      background: rgba(255,255,255,.08);
    }

    .hero h1 {
      max-width: 760px;
      margin: 18px 0 12px;
      font-size: clamp(38px, 6vw, 68px);
      line-height: 1.02;
    }

    .subtitle {
      max-width: 680px;
      color: #dbeafe;
      font-size: 17px;
      line-height: 1.7;
    }

    .student-card {
      width: fit-content;
      margin-top: 28px;
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 12px 18px;
      border-radius: 12px;
      background: rgba(255,255,255,.12);
    }

    .student-card span {
      color: #bfdbfe;
      font-size: 13px;
    }

    .student-card strong {
      font-size: 16px;
    }

    .container {
      width: min(92%, 1050px);
      margin: -45px auto 60px;
    }

    .todo-panel,
    .tree-card,
    .info-card {
      background: white;
      border: 1px solid #dbe3ed;
      box-shadow: 0 16px 45px rgba(15,23,42,.08);
    }

    .todo-panel {
      padding: 32px;
      border-radius: 20px;
    }

    .panel-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .eyebrow {
      color: #2563eb;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .panel-heading h2 {
      margin-top: 3px;
      font-size: 30px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stats span {
      padding: 8px 11px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
    }

    .task-form {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 12px;
      margin-bottom: 25px;
    }

    .input-wrap label {
      display: block;
      margin-bottom: 7px;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
    }

    .input-wrap input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      background: #f8fafc;
      color: #172033;
    }

    .input-wrap input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37,99,235,.12);
    }

    .input-wrap input[aria-invalid="true"] {
      border-color: #dc2626;
    }

    .add-button {
      min-height: 48px;
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: #2563eb;
      font-weight: 800;
    }

    .add-button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .error-message {
      margin-top: 7px;
      color: #dc2626;
      font-size: 13px;
      font-weight: 600;
    }

    .task-list {
      display: grid;
      gap: 10px;
      list-style: none;
    }

    .task-item {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 12px;
      min-height: 62px;
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #f8fafc;
      transition: .2s ease;
    }

    .task-item:hover {
      border-color: #bfdbfe;
      transform: translateY(-1px);
    }

    .check-button {
      width: 30px;
      height: 30px;
      border: 2px solid #94a3b8;
      border-radius: 50%;
      color: white;
      background: white;
      font-weight: 900;
    }

    .is-completed .check-button {
      border-color: #16a34a;
      background: #16a34a;
    }

    .task-text {
      overflow-wrap: anywhere;
    }

    .is-completed .task-text {
      color: #64748b;
      text-decoration: line-through;
    }

    .task-actions {
      display: flex;
      gap: 7px;
    }

    .complete-button,
    .delete-button {
      padding: 7px 10px;
      border: 0;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 800;
    }

    .complete-button {
      color: #166534;
      background: #dcfce7;
    }

    .delete-button {
      color: #b91c1c;
      background: #fee2e2;
    }

    .empty-state {
      padding: 45px 20px;
      text-align: center;
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      color: #64748b;
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #166534;
      background: #dcfce7;
      font-size: 24px;
      font-weight: 900;
    }

    .empty-state h3 {
      margin-bottom: 4px;
      color: #334155;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .info-card {
      min-height: 170px;
      padding: 24px;
      border-radius: 16px;
    }

    .info-number {
      color: #bfdbfe;
      font-size: 36px;
      font-weight: 900;
    }

    .info-card h3 {
      margin: 5px 0 7px;
      font-size: 20px;
    }

    .info-card p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
    }

    .tree-card {
      margin-top: 20px;
      padding: 28px;
      border-radius: 16px;
    }

    .tree-card h2 {
      margin-bottom: 15px;
    }

    .tree-card pre {
      padding: 20px;
      overflow-x: auto;
      border-radius: 10px;
      background: #0f172a;
      color: #dbeafe;
      font-size: 14px;
      line-height: 1.7;
    }

    footer {
      padding: 30px 20px;
      text-align: center;
      color: #64748b;
      background: #e2e8f0;
      line-height: 1.7;
    }

    @media (max-width: 720px) {
      .hero {
        padding: 55px 20px 90px;
      }

      .container {
        width: 94%;
      }

      .todo-panel {
        padding: 22px;
      }

      .panel-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .task-form {
        grid-template-columns: 1fr;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .task-item {
        grid-template-columns: 34px 1fr;
      }

      .task-actions {
        grid-column: 2;
      }

      .complete-button,
      .delete-button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <!--
    LAB 3 - INTRODUCTION TO REACT.JS
    Student Name: Rahul Raj

    This is a SINGLE FILE React implementation.
    React and Babel are loaded from CDN so no npm setup is
    required for this standalone demonstration.
  -->

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">

    const { useEffect, useState } = React;

    const STORAGE_KEY = "rahul-raj-lab3-todos";


    /* =====================================================
       COMPONENT: AddTaskForm
    ====================================================== */

    function AddTaskForm({ onAddTask }) {

      const [taskText, setTaskText] = useState("");
      const [error, setError] = useState("");


      function handleSubmit(event) {

        event.preventDefault();

        const cleanText = taskText.trim();


        if (cleanText === "") {

          setError("Please enter a task before adding it.");

          return;
        }


        if (cleanText.length < 2) {

          setError("Task should contain at least 2 characters.");

          return;
        }


        onAddTask(cleanText);

        setTaskText("");

        setError("");
      }


      function handleChange(event) {

        setTaskText(event.target.value);

        if (error) {
          setError("");
        }
      }


      return (
        <form
          className="task-form"
          onSubmit={handleSubmit}
          noValidate
        >

          <div className="input-wrap">

            <label htmlFor="task-input">
              New Task
            </label>

            <input
              id="task-input"
              type="text"
              value={taskText}
              onChange={handleChange}
              placeholder="e.g. Complete React assignment"
              aria-describedby={
                error ? "task-error" : undefined
              }
              aria-invalid={Boolean(error)}
            />

            {error && (
              <p
                id="task-error"
                className="error-message"
                role="alert"
              >
                {error}
              </p>
            )}

          </div>


          <button
            className="add-button"
            type="submit"
          >
            + Add Task
          </button>

        </form>
      );
    }



    /* =====================================================
       COMPONENT: TaskItem
    ====================================================== */

    function TaskItem({
      task,
      onToggleTask,
      onDeleteTask
    }) {

      return (

        <li
          className={
            `task-item ${
              task.completed ? "is-completed" : ""
            }`
          }
        >

          <button
            className="check-button"
            type="button"
            onClick={() => onToggleTask(task.id)}
            aria-label={
              task.completed
                ? `Undo ${task.text}`
                : `Complete ${task.text}`
            }
          >
            {task.completed ? "✓" : ""}
          </button>


          <span className="task-text">
            {task.text}
          </span>


          <div className="task-actions">

            <button
              className="complete-button"
              type="button"
              onClick={() => onToggleTask(task.id)}
            >
              {task.completed ? "Undo" : "Complete"}
            </button>


            <button
              className="delete-button"
              type="button"
              onClick={() => onDeleteTask(task.id)}
            >
              Delete
            </button>

          </div>

        </li>
      );
    }



    /* =====================================================
       COMPONENT: TaskList
    ====================================================== */

    function TaskList({
      tasks,
      onToggleTask,
      onDeleteTask
    }) {

      if (tasks.length === 0) {

        return (

          <div className="empty-state">

            <div className="empty-icon">
              ✓
            </div>

            <h3>
              No tasks yet
            </h3>

            <p>
              Add your first task using the form above.
            </p>

          </div>
        );
      }


      return (

        <ul
          className="task-list"
          aria-label="Todo tasks"
        >

          {tasks.map((task) => (

            <TaskItem
              key={task.id}
              task={task}
              onToggleTask={onToggleTask}
              onDeleteTask={onDeleteTask}
            />

          ))}

        </ul>
      );
    }



    /* =====================================================
       COMPONENT: App
    ====================================================== */

    function App() {

      const [tasks, setTasks] = useState(() => {

        try {

          const saved =
            localStorage.getItem(STORAGE_KEY);

          return saved
            ? JSON.parse(saved)
            : [];

        } catch {

          return [];
        }
      });


      /* useEffect for persistence */

      useEffect(() => {

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(tasks)
        );

      }, [tasks]);


      /* Add task */

      function addTask(text) {

        const newTask = {

          id: Date.now(),

          text: text,

          completed: false
        };


        setTasks((currentTasks) => [

          newTask,

          ...currentTasks

        ]);
      }


      /* Complete / Undo task */

      function toggleTask(id) {

        setTasks((currentTasks) =>

          currentTasks.map((task) =>

            task.id === id

              ? {
                  ...task,
                  completed: !task.completed
                }

              : task

          )
        );
      }


      /* Delete task */

      function deleteTask(id) {

        setTasks((currentTasks) =>

          currentTasks.filter(
            (task) => task.id !== id
          )

        );
      }


      const completedCount =
        tasks.filter(
          (task) => task.completed
        ).length;


      return (

        <div className="app">


          <header className="hero">

            <div className="hero-content">

              <span className="lab-badge">
                LAB 3 • REACT.JS
              </span>


              <h1>
                Interactive Todo Application
              </h1>


              <p className="subtitle">
                A component-based React frontend using
                useState, useEffect, props and
                LocalStorage persistence.
              </p>


              <div className="student-card">

                <span>
                  Student Name
                </span>

                <strong>
                  Rahul Raj
                </strong>

              </div>

            </div>

          </header>



          <main className="container">


            <section
              className="todo-panel"
              aria-labelledby="todo-heading"
            >

              <div className="panel-heading">

                <div>

                  <p className="eyebrow">
                    Task Management
                  </p>

                  <h2 id="todo-heading">
                    My Tasks
                  </h2>

                </div>


                <div className="stats">

                  <span>
                    {tasks.length} Total
                  </span>

                  <span>
                    {completedCount} Completed
                  </span>

                </div>

              </div>


              {/* Parent -> Child props */}

              <AddTaskForm
                onAddTask={addTask}
              />


              {/* Parent -> Child props */}

              <TaskList
                tasks={tasks}
                onToggleTask={toggleTask}
                onDeleteTask={deleteTask}
              />

            </section>



            <section
              className="info-grid"
              aria-label="React concepts used"
            >

              <article className="info-card">

                <span className="info-number">
                  01
                </span>

                <h3>
                  useState
                </h3>

                <p>
                  Stores the task list and form state
                  and updates the interface dynamically.
                </p>

              </article>


              <article className="info-card">

                <span className="info-number">
                  02
                </span>

                <h3>
                  useEffect
                </h3>

                <p>
                  Synchronizes task changes with
                  browser LocalStorage.
                </p>

              </article>


              <article className="info-card">

                <span className="info-number">
                  03
                </span>

                <h3>
                  Props
                </h3>

                <p>
                  Passes task data and callback
                  functions between components.
                </p>

              </article>

            </section>



            <section
              className="tree-card"
              aria-labelledby="tree-heading"
            >

              <h2 id="tree-heading">
                Component Tree
              </h2>


              <pre>{`App
├── AddTaskForm
│   └── onAddTask() → App
└── TaskList
    └── TaskItem
        ├── onToggleTask() → App
        └── onDeleteTask() → App`}</pre>

            </section>

          </main>



          <footer>

            <p>
              Lab 3 — Introduction to React.js
            </p>

            <p>
              Student: Rahul Raj
            </p>

          </footer>

        </div>
      );
    }



    /* =====================================================
       RENDER REACT APPLICATION
    ====================================================== */

    const root =
      ReactDOM.createRoot(
        document.getElementById("root")
      );


    root.render(
      <React.StrictMode>
        <App />
      </React.StrictMode>
    );

  </script>

</body>
</html>
