<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Postman API Test Simulation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1e1e1e;
      color: #cccccc;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Top Bar */
    .pm-header {
      background: #252526;
      border-bottom: 1px solid #333333;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pm-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: #ff6c37;
      font-size: 14px;
    }
    .pm-tabs {
      display: flex;
      gap: 4px;
      margin-left: 20px;
    }
    .pm-tab {
      background: #1e1e1e;
      padding: 6px 14px;
      font-size: 13px;
      border-radius: 4px 4px 0 0;
      border-top: 2px solid #ff6c37;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    /* Workspace Area */
    .pm-main {
      flex: 1;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }
    /* Request Bar */
    .pm-request-bar {
      display: flex;
      align-items: center;
      background: #2d2d2d;
      border: 1px solid #3c3c3c;
      border-radius: 6px;
      overflow: hidden;
    }
    .method-badge {
      font-weight: 700;
      font-size: 13px;
      padding: 10px 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .method-GET { color: #0cbb52; }
    .method-POST { color: #ffb400; }
    .method-PATCH { color: #a463f8; }
    .method-DELETE { color: #eb2013; }
    .method-PUT { color: #097bed; }

    .url-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: monospace;
      font-size: 14px;
      padding: 10px;
      outline: none;
    }
    .send-btn {
      background: #097bed;
      color: white;
      font-weight: 600;
      border: none;
      padding: 10px 24px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 0 4px 4px 0;
    }
    /* Split Panels */
    .pm-req-preview {
      background: #252526;
      border: 1px solid #333333;
      border-radius: 4px;
      padding: 10px 14px;
      font-size: 12px;
      font-family: monospace;
      color: #9cdcfe;
    }
    .pm-response-panel {
      flex: 1;
      background: #252526;
      border: 1px solid #333333;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .response-header {
      background: #2d2d2d;
      padding: 8px 16px;
      border-bottom: 1px solid #333333;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .response-tabs {
      display: flex;
      gap: 16px;
      font-size: 13px;
      font-weight: 600;
    }
    .response-tab {
      color: #858585;
      padding-bottom: 4px;
    }
    .response-tab.active {
      color: #ffffff;
      border-bottom: 2px solid #ff6c37;
    }
    .response-meta {
      display: flex;
      gap: 16px;
      font-size: 12px;
    }
    .meta-item strong {
      color: #ffffff;
      margin-left: 4px;
    }
    .status-ok { color: #0cbb52 !important; }
    .status-created { color: #0cbb52 !important; }
    .status-bad { color: #eb2013 !important; }

    .response-body {
      flex: 1;
      padding: 16px;
      overflow: auto;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      background: #1e1e1e;
      color: #d4d4d4;
      white-space: pre-wrap;
    }
    /* Syntax highlights */
    .json-key { color: #9cdcfe; }
    .json-str { color: #ce9178; }
    .json-num { color: #b5cea8; }
    .json-bool { color: #569cd6; }

    .test-results-panel {
      padding: 12px 16px;
      background: #1e1e1e;
      border-bottom: 1px solid #333333;
      font-size: 13px;
    }
    .test-badge-pass {
      background: #0e6231;
      color: #73e6a4;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      margin-right: 8px;
    }
    .test-row {
      display: flex;
      align-items: center;
      padding: 4px 0;
    }
  </style>
</head>
<body>

  <div class="pm-header">
    <div class="pm-logo">
      <svg width="20" height="20" viewBox="0 0 32 32" fill="#ff6c37">
        <path d="M16 0C7.163 0 0 7.163 0 16s7.163 16 16 16 16-7.163 16-16S24.837 0 16 0zm9.4 17.5c-.8 0-1.5-.7-1.5-1.5s.7-1.5 1.5-1.5 1.5.7 1.5 1.5-.7 1.5-1.5 1.5zm-5-3.3c-.8 0-1.5-.7-1.5-1.5s.7-1.5 1.5-1.5 1.5.7 1.5 1.5-.7 1.5-1.5 1.5zm-8.8 0c-.8 0-1.5-.7-1.5-1.5s.7-1.5 1.5-1.5 1.5.7 1.5 1.5-.7 1.5-1.5 1.5zm-5 3.3c-.8 0-1.5-.7-1.5-1.5s.7-1.5 1.5-1.5 1.5.7 1.5 1.5-.7 1.5-1.5 1.5z"/>
      </svg>
      <span>Postman</span>
    </div>
    <div class="pm-tabs">
      <div class="pm-tab">
        <span id="tab-method" class="method-GET">GET</span>
        <span id="tab-title">QuickBite API Test</span>
      </div>
    </div>
  </div>

  <div class="pm-main">
    <div class="pm-request-bar">
      <span id="req-method" class="method-badge method-GET">GET</span>
      <input type="text" id="req-url" class="url-input" readonly value="http://localhost:5000/api/items" />
      <button class="send-btn">Send</button>
    </div>

    <div id="req-body-preview" class="pm-req-preview" style="display: none;"></div>

    <div class="pm-response-panel">
      <div class="response-header">
        <div class="response-tabs">
          <div class="response-tab active">Body (Pretty JSON)</div>
          <div class="response-tab">Test Results <span id="test-count">(3/3 PASS)</span></div>
        </div>
        <div class="response-meta">
          <div class="meta-item">Status: <strong id="res-status" class="status-ok">200 OK</strong></div>
          <div class="meta-item">Time: <strong id="res-time">24 ms</strong></div>
          <div class="meta-item">Size: <strong id="res-size">1.82 KB</strong></div>
        </div>
      </div>

      <div class="test-results-panel" id="tests-list"></div>

      <div class="response-body" id="res-body"></div>
    </div>
  </div>

  <script>
    const testCases = {
      'get_items': {
        method: 'GET',
        url: 'http://localhost:5000/api/items?category=Main%20Course',
        status: '200 OK',
        statusClass: 'status-ok',
        time: '21 ms',
        size: '1.45 KB',
        reqBody: null,
        tests: [
          'Status code is 200 OK',
          'Response is an array of menu items',
          'All returned items match category "Main Course"'
        ],
        body: JSON.stringify([
          {
            "_id": "674dd802a4bf4a0018a1a001",
            "name": "Butter Chicken Rice Bowl",
            "price": 320,
            "category": "Main Course",
            "isAvailable": true,
            "createdAt": "2026-10-01T04:46:56.120Z"
          },
          {
            "_id": "674dd802a4bf4a0018a1a002",
            "name": "Paneer Butter Masala Naan Combo",
            "price": 280,
            "category": "Main Course",
            "isAvailable": true,
            "createdAt": "2026-10-01T04:46:56.121Z"
          },
          {
            "_id": "674dd802a4bf4a0018a1a003",
            "name": "Wood-Fired Margherita Pizza",
            "price": 350,
            "category": "Main Course",
            "isAvailable": true,
            "createdAt": "2026-10-01T04:46:56.122Z"
          }
        ], null, 2)
      },

      'post_order': {
        method: 'POST',
        url: 'http://localhost:5000/api/orders',
        status: '201 Created',
        statusClass: 'status-created',
        time: '42 ms',
        size: '780 B',
        reqBody: JSON.stringify({
          customerName: "Priyanshu Verma",
          phone: "9876543210",
          address: "Apt 204, Royal Palms, Koramangala, Bengaluru",
          items: [
            { itemId: "674dd802a4bf4a0018a1a001", qty: 2 }
          ]
        }, null, 2),
        tests: [
          'Status code is 201 Created',
          'Server recalculates totalAmount from database (320 * 2 = 640)',
          'Initial order status set to "Placed"',
          'Customer phone validation passed (10 digits)'
        ],
        body: JSON.stringify({
          "_id": "674dd950b7ca890019e2f114",
          "customerName": "Priyanshu Verma",
          "phone": "9876543210",
          "address": "Apt 204, Royal Palms, Koramangala, Bengaluru",
          "items": [
            {
              "itemId": "674dd802a4bf4a0018a1a001",
              "name": "Butter Chicken Rice Bowl",
              "price": 320,
              "qty": 2
            }
          ],
          "totalAmount": 640,
          "status": "Placed",
          "createdAt": "2026-10-01T04:52:14.350Z"
        }, null, 2)
      },

      'patch_order_status': {
        method: 'PATCH',
        url: 'http://localhost:5000/api/orders/674dd950b7ca890019e2f114/status',
        status: '200 OK',
        statusClass: 'status-ok',
        time: '28 ms',
        size: '810 B',
        reqBody: JSON.stringify({
          status: "Preparing"
        }, null, 2),
        tests: [
          'Status code is 200 OK',
          'Order status advanced forward: Placed -> Preparing',
          'Status transition strictly validated'
        ],
        body: JSON.stringify({
          "_id": "674dd950b7ca890019e2f114",
          "customerName": "Priyanshu Verma",
          "phone": "9876543210",
          "address": "Apt 204, Royal Palms, Koramangala, Bengaluru",
          "items": [
            {
              "itemId": "674dd802a4bf4a0018a1a001",
              "name": "Butter Chicken Rice Bowl",
              "price": 320,
              "qty": 2
            }
          ],
          "totalAmount": 640,
          "status": "Preparing",
          "createdAt": "2026-10-01T04:52:14.350Z"
        }, null, 2)
      },

      'patch_cancel_rejection': {
        method: 'PATCH',
        url: 'http://localhost:5000/api/orders/674dd950b7ca890019e2f114/status',
        status: '400 Bad Request',
        statusClass: 'status-bad',
        time: '18 ms',
        size: '340 B',
        reqBody: JSON.stringify({
          status: "Cancelled"
        }, null, 2),
        tests: [
          'Status code is 400 Bad Request',
          'Cancel rejected: order is already in "Preparing" status',
          'Order cancellation allowed ONLY while status is "Placed"'
        ],
        body: JSON.stringify({
          "error": "Order cannot be cancelled because it is already 'Preparing'. An order can be cancelled only while its status is 'Placed'."
        }, null, 2)
      }
    };

    function loadTest(testId) {
      const t = testCases[testId] || testCases['get_items'];
      
      document.getElementById('tab-method').className = 'method-' + t.method;
      document.getElementById('tab-method').innerText = t.method;
      document.getElementById('tab-title').innerText = t.url.split('/').slice(-2).join('/');
      
      document.getElementById('req-method').className = 'method-badge method-' + t.method;
      document.getElementById('req-method').innerText = t.method;
      document.getElementById('req-url').value = t.url;

      const reqPreview = document.getElementById('req-body-preview');
      if (t.reqBody) {
        reqPreview.style.display = 'block';
        reqPreview.innerText = 'Request Body (application/json):\n' + t.reqBody;
      } else {
        reqPreview.style.display = 'none';
      }

      document.getElementById('res-status').innerText = t.status;
      document.getElementById('res-status').className = t.statusClass;
      document.getElementById('res-time').innerText = t.time;
      document.getElementById('res-size').innerText = t.size;

      document.getElementById('test-count').innerText = `(${t.tests.length}/${t.tests.length} PASS)`;

      const testsList = document.getElementById('tests-list');
      testsList.innerHTML = t.tests.map(testText => `
        <div class="test-row">
          <span class="test-badge-pass">PASS</span>
          <span>${testText}</span>
        </div>
      `).join('');

      document.getElementById('res-body').innerText = t.body;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const selected = urlParams.get('test') || 'get_items';
    loadTest(selected);
  </script>
</body>
</html>
