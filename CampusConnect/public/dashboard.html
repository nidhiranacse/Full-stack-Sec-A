<!DOCTYPE html>
<html>

<head>
    <title>Login - CampusConnect</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-container">

    <h2>CampusConnect Login</h2>

    <input
        id="email"
        type="email"
        placeholder="Email"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <button onclick="login()">
        Login
    </button>

    <p id="message"></p>

</div>

<script src="script.js"></script>

</body>

</html>
