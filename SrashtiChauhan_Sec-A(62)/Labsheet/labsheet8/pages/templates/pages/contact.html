{% extends "pages/base.html" %}

{% block title %}
Contact Us
{% endblock %}

{% block content %}

<div class="contact-container">

    <div class="contact-header">
        <h1>Contact Us</h1>
        <p>
            We'd love to hear from you. Send us your feedback,
            questions, or suggestions.
        </p>
    </div>

    <form method="POST" class="contact-form">

        {% csrf_token %}

        <div class="form-group">
            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="form-group">
            <label for="feedback">Your Feedback</label>

            <textarea
                id="feedback"
                name="feedback"
                rows="6"
                placeholder="Write your feedback here..."
                required
            ></textarea>
        </div>

        <button type="submit">
            Submit Feedback
        </button>

    </form>

</div>

<style>

    .contact-container {
        max-width: 650px;
        margin: 20px auto;
        background: white;
        padding: 35px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .contact-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .contact-header h1 {
        margin-bottom: 10px;
    }

    .contact-header p {
        color: #666;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
        box-sizing: border-box;
    }

    .form-group textarea {
        resize: vertical;
    }

    .contact-form button {
        width: 100%;
        padding: 13px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    .contact-form button:hover {
        background: #0056b3;
    }

</style>

{% endblock %}
