version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/campusconnect
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_access_key_12345
      - REFRESH_SECRET=super_secret_refresh_key_67890
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb
      - redis

  frontend:
    build: ./Frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data: