<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Record Management System</title>
        <link rel="stylesheet" href="style.css">

    </head>
    <body>
        <div class="container">
            <h1>Student Record Management System</h1>
            <form id="studentForm">
                <input
                type="text"
                id="name"
                placeholder="Student Name"
                required
                >
                <input 
                type="text"
                id="rollNo"
                placeholder="Roll No."
                required
                >
                <input
                type="text"
                id="course"
                placeholder="Course"
                required
                >
                <input
                type="text"
                id="marks"
                placeholder="Marks (0-100)"
                min="0"
                max="100"
                required
                >
                <button type="submit">Add Student</button>

            </form>
            <h2>Student Records</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Roll No.</th>
                        <th>Course</th>
                        <th>Marks</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <!-- Student records will appear here -->
                </tbody>
            </table>
        </div>
        <script src="script.js"></script>
    </body>
</html>
