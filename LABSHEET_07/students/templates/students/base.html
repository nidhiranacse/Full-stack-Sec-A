<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Lab Sheet 7{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f7f8fa;
            color: #222;
        }

        h1 {
            color: #2c3e50;
        }

        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #2c7be5;
            font-weight: bold;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 15px;
            background: #fff;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background: #2c3e50;
            color: #fff;
        }

        th a {
            color: #fff;
            text-decoration: none;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 4px;
            margin-top: 15px;
        }

        .alert-warning {
            background: #fff3cd;
            border: 1px solid #ffe08a;
            color: #7a5b00;
        }

        .alert-info {
            background: #e7f1ff;
            border: 1px solid #b6d4fe;
            color: #084298;
        }

        ul.fruit-list {
            columns: 3;
        }

        form.search-form input[type="text"] {
            padding: 6px 10px;
            width: 260px;
        }

        form.search-form button {
            padding: 6px 14px;
            background: #2c7be5;
            color: #fff;
            border: none;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="{% url 'students:fruit_list' %}">
            Fruits (Unordered)
        </a>

        <a href="{% url 'students:student_list' %}">
            Selected Event Students (Ordered)
        </a>

        <a href="{% url 'students:search_students' %}">
            Search Students
        </a>
    </nav>

    <hr>

    {% block content %}
    {% endblock %}

</body>
</html>
