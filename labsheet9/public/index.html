<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Record Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Record Management System</h1>

        <div class="form-box">

            <h2>Add / Update Student</h2>

            <form id="studentForm">

                <input type="hidden" id="studentId">

                <label>Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter student name"
                    required
                >

                <label>Roll No.</label>
                <input
                    type="text"
                    id="rollNo"
                    placeholder="Enter roll number"
                    required
                >

                <label>Course</label>
                <input
                    type="text"
                    id="course"
                    placeholder="Enter course"
                    required
                >

                <label>Marks</label>
                <input
                    type="number"
                    id="marks"
                    placeholder="Enter marks"
                    min="0"
                    max="100"
                    required
                >

                <button type="submit" id="submitButton">
                    Add Student
                </button>

                <button
                    type="button"
                    id="cancelButton"
                    onclick="cancelEdit()"
                    style="display: none;"
                >
                    Cancel
                </button>

            </form>

        </div>

        <div class="table-box">

            <h2>Student Records</h2>

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll No.</th>
                        <th>Course</th>
                        <th>Marks</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTableBody">
                </tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
