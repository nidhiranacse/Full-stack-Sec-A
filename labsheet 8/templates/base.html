<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        {% block title %}
        Lab Sheet 08
        {% endblock %}
        | MySite
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


    <!-- =====================================================
         NAVIGATION BAR
         ===================================================== -->

    <nav class="navbar">

        <div class="brand">
            MySite
        </div>


        <ul class="nav-links">

            <li>

                <a
                    href="{{ url_for('home') }}"
                    class="{{ 'active' if active_page == 'home' else '' }}"
                >
                    Home
                </a>

            </li>


            <li>

                <a
                    href="{{ url_for('about') }}"
                    class="{{ 'active' if active_page == 'about' else '' }}"
                >
                    About Us
                </a>

            </li>


            <li>

                <a
                    href="{{ url_for('contact') }}"
                    class="{{ 'active' if active_page == 'contact' else '' }}"
                >
                    Contact Us
                </a>

            </li>

        </ul>

    </nav>



    <!-- =====================================================
         FLASH / NOTIFICATION MESSAGES
         ===================================================== -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            <div class="notification-wrapper">

                {% for category, message in messages %}

                    <div class="notification-box notification-{{ category }}">

                        <span class="notification-text">
                            {{ message }}
                        </span>


                        <span
                            class="notification-close"
                            onclick="this.parentElement.style.display='none';"
                        >
                            &times;
                        </span>

                    </div>

                {% endfor %}

            </div>

        {% endif %}

    {% endwith %}



    <!-- =====================================================
         PAGE CONTENT
         ===================================================== -->

    <main class="page-content">

        {% block content %}

        <!-- Child templates override this section -->

        {% endblock %}

    </main>



    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="site-footer">

        <p>
            &copy; 2026 MySite &mdash; Lab Sheet 08 Demo
        </p>

    </footer>


</body>

</html>
