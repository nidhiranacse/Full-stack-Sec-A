<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Lab 08{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        nav {
            background: #2563eb;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            padding: 8px 12px;
            border-radius: 8px;
        }

        nav a.active {
            background: white;
            color: #2563eb;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 20px #0001;
        }

        .message {
            background: #dcfce7;
            color: #166534;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        button {
            background: #2563eb;
            color: white;
            border: 0;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<nav>
    <h2>Django Lab 08</h2>

    <div>
        <a href="/" class="{% if active_page == 'home' %}active{% endif %}">
            Home
        </a>

        <a href="/about/" class="{% if active_page == 'about' %}active{% endif %}">
            About Us
        </a>

        <a href="/contact/" class="{% if active_page == 'contact' %}active{% endif %}">
            Contact Us
        </a>
    </div>
</nav>

<div class="container">

    {% if message %}
        <div class="message">
            {{ message }}
        </div>
    {% endif %}

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
