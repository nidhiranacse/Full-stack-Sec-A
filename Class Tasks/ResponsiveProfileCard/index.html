<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Makes the page responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Love | Profile Card</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome for social media icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main page -->
    <main class="page">

        <!-- Profile Card -->
        <section class="profile-card">

            <!-- Profile image -->
            <div class="profile-image">

                <!-- Keep profile.jpg in the same folder -->
                <img src="profile.jpg" alt="Love's profile photo">

            </div>


            <!-- Profile information -->
            <div class="profile-info">

                <!-- Name -->
                <h1>Love</h1>

                <!-- Designation -->
                <p class="designation">
                    Full Stack Developer
                </p>

                <!-- Short introduction -->
                <p class="description">
                    Passionate developer who loves building modern,
                    responsive and user-friendly web applications.
                </p>


                <!-- Social media icons -->
                <div class="social-icons">

                    <!-- LinkedIn -->
                    <a href="https://www.linkedin.com/in/love-102a78320" target="_blank" rel="noopener noreferrer"
                        aria-label="LinkedIn">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>


                    <!-- GitHub -->
                    <a href="https://github.com/Love-hash-cell" target="_blank" rel="noopener noreferrer"
                        aria-label="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>


                    <!-- X / Twitter -->
                    <a href="https://x.com/" target="_blank" rel="noopener noreferrer" aria-label="X / Twitter">
                        <i class="fa-brands fa-x-twitter"></i>
                    </a>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
