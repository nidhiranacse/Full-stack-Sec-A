version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: campus_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.0-alpine
    container_name: campus_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: campus_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/campus_events_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=pulkit_campus_secret_key_cu24250263
    depends_on:
      - mongodb
      - redis

  frontend:
    build: ./frontend
    container_name: campus_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
